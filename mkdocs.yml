site_name: 经济统计指南
site_description: 经济统计学习指南与资源
site_author: butforyou
site_url: https://butforyou.github.io/a-guide-of-economic-statistics/

theme:
  name: material
  palette:
    primary: blue
    accent: light blue
  features:
    - navigation.expand
    - navigation.indexes
    - toc.integrate
    - search.suggest
    - search.highlight

# 插件
plugins:
  - search

# 页面导航
nav:
  - 序: index.md
  - 旅行前的准备:
    - 概述: tools/index.md
    - 文本编辑与笔记: tools/editor.md
    - 版本控制: tools/git.md
    - AI 工具: tools/ai.md
    - 环境与系统: tools/environment.md
    - 科学计算与可视化: tools/scientific.md
  - Python 编程基础: chapter5.md
  - 线性代数: linear-algebra.md
  - 概率论与数理统计:
    - 概述: probability/index.md
    - 茆诗松教材: probability/mao.md
    - 陈希孺教材: probability/chen.md
  - 机器学习: chapter2.md
  - 深度学习与计算机视觉: chapter3.md
  - 自然语言处理: cs224n.md
  - 推荐系统: chapter4.md
  - 数据结构: datastructure.md
  

# 扩展
markdown_extensions:
  - admonition
  - codehilite
  - extra
  - toc:
      permalink: true
  - pymdownx.arithmatex
  - pymdownx.superfences

# 版权信息
copyright: Copyright &copy; 2024 butforyou